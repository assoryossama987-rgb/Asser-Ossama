<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asser Ossama</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#ffad4d;--cream:#ffe6c8}
body{
 min-height:100vh;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:
 radial-gradient(circle at 50% 8%,#ff9a3d 0%,#b84412 18%,#42170b 43%,#100806 72%,#050506 100%);
 background-attachment:fixed;
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:
 radial-gradient(circle at 50% 25%,rgba(255,169,76,.23),transparent 28%),
 linear-gradient(180deg,rgba(255,125,30,.10),transparent 42%,rgba(0,0,0,.28));}
.wrap{width:min(940px,92%);margin:auto;padding:38px 0 50px;position:relative}
.header{display:flex;justify-content:space-between;align-items:flex-start}
.signature{font-family:cursive;font-size:clamp(2.5rem,6vw,4.5rem);line-height:.88;font-style:italic;color:#fff1dd}
.side{text-align:right;text-transform:uppercase;letter-spacing:.28em;font-size:.68rem;line-height:1.8;opacity:.88}
.profile{text-align:center;margin-top:-5px}
.avatar{
 width:195px;height:195px;margin:0 auto 18px;border-radius:50%;overflow:hidden;
 border:2px solid #ffd08e;box-shadow:0 0 34px rgba(255,157,63,.55),0 0 75px rgba(255,104,15,.22);
 background:#1a0c07;
}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:center 43%;display:block}
h1{font-size:clamp(2.15rem,6vw,3.8rem);letter-spacing:-.045em;text-shadow:0 3px 18px rgba(0,0,0,.45)}
.roles{margin-top:8px;text-transform:uppercase;letter-spacing:.28em;font-size:.95rem}
.rule{width:68px;height:2px;background:var(--cream);margin:23px auto;box-shadow:0 0 10px rgba(255,166,75,.7)}
.quote{text-transform:uppercase;letter-spacing:.18em;font-size:1rem;opacity:.86}
.links{margin-top:34px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{
 color:#fff;text-decoration:none;min-height:108px;padding:20px;display:flex;align-items:center;gap:18px;
 border:1px solid rgba(255,181,98,.42);border-radius:22px;
 background:linear-gradient(135deg,rgba(28,22,19,.82),rgba(7,8,9,.68));
 backdrop-filter:blur(13px);box-shadow:inset 0 1px rgba(255,255,255,.05);
 transition:.2s transform,.2s border-color,.2s box-shadow;
}
.card:hover{transform:translateY(-3px);border-color:rgba(255,194,118,.9);box-shadow:0 14px 38px rgba(0,0,0,.35),0 0 24px rgba(255,123,24,.12)}
.icon{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;flex:none;font-weight:800;font-size:1.5rem}
.card h2{font-size:1.08rem}
.arrow{margin-left:auto;font-size:1.8rem;opacity:.85}
.instagram .icon{background:linear-gradient(135deg,#ffb52f,#e83275,#6b36d9)}
.whatsapp .icon,.phone .icon{background:#12b95d}
.snapchat .icon{background:#ffd72d;color:#111}
.linkedin .icon{background:#0a72c9}
.gmail .icon{background:#fff}
.cv .icon{background:#713de0}
.cv{grid-column:1/-1}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.action{padding:19px;border:1px solid rgba(255,208,150,.72);border-radius:20px;background:rgba(22,15,12,.65);color:#fff;font-weight:700;font-size:1rem;cursor:pointer}
.footer{text-align:center;margin-top:44px;opacity:.78}
.tag{font-family:cursive;font-size:1.35rem;word-spacing:12px}
.ball{font-size:2.3rem;margin-top:12px;color:#ffd08e}
@media(max-width:700px){
 .wrap{padding-top:24px}.avatar{width:150px;height:150px}.roles{font-size:.68rem;letter-spacing:.14em;line-height:1.8}
 .links,.actions{grid-template-columns:1fr}.cv{grid-column:auto}.card{min-height:90px}.side{font-size:.55rem}
}
</style>
</head>
<body>

 </a>

<script>
function saveContact(){
 const v=`BEGIN:VCARD\nVERSION:3.0\nFN:Asser Ossama\nTEL;TYPE=CELL:+201557319335\nEMAIL:asserossama18@gmail.com\nURL:https://www.linkedin.com/in/asser-ossama-2487053b2\nEND:VCARD`;

async function shareProfile(){
 if(navigator.share){await navigator.share({title:"Asser Ossama",text:"Student • Communication • Volleyball",url:location.href});}
 else{await navigator.clipboard.writeText(location.href);alert("Profile link copied!");}
